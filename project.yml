name: GymPlanner
options:
  bundleIdPrefix: app.gymplanner
  deploymentTarget:
    iOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    ENABLE_USER_SCRIPT_SANDBOXING: 'NO'
    CODE_SIGNING_ALLOWED: 'NO'
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: '2'
targets:
  GymPlanner:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Gym Planner
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Take a photo of a meal or a nutrition label to send to the coach.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gymplanner.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: 'NO'
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: 'NO'
  GymPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GymPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gymplanner.tests
        GENERATE_INFOPLIST_FILE: 'YES'
  GymPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: GymPlanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.gymplanner.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
        TEST_TARGET_NAME: GymPlanner
schemes:
  GymPlanner:
    build:
      targets:
        GymPlanner: all
        GymPlannerTests: [test]
        GymPlannerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GymPlannerTests
        - GymPlannerUITests
    archive:
      config: Release
